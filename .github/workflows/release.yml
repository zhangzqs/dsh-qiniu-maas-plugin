name: Release Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild and upload, for example v0.1.6-rc.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PLUGIN_VERSION="$(node -p "require('./packages/dsh-qiniu-maas-plugin/package.json').version")"
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match plugin version $PLUGIN_VERSION"
            exit 1
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Type-check packages
        run: pnpm typecheck

      - name: Pack plugin
        run: pnpm pack:plugin

      - name: Verify plugin package
        run: |
          PACKAGE_COUNT="$(find dist -maxdepth 1 -type f -name '*.tgz' | wc -l)"
          if [ "$PACKAGE_COUNT" -ne 1 ]; then
            echo "Expected exactly one plugin package, found $PACKAGE_COUNT"
            exit 1
          fi

          PACKAGE_PATH="$(find dist -maxdepth 1 -type f -name '*.tgz' -print)"
          tar -tzf "$PACKAGE_PATH" | grep -Fx 'package/package.json'
          tar -tzf "$PACKAGE_PATH" | grep -Fx 'package/cordis.patch.yml'
          tar -tzf "$PACKAGE_PATH" | grep -Fx 'package/lib/index.js'
          tar -tzf "$PACKAGE_PATH" | grep -Fx 'package/lib/client.js'

      - name: Upload plugin package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG_NAME" dist/*.tgz --clobber
